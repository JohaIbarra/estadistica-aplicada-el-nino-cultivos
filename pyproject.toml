[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agroclima"
version = "1.0.0"
description = "Impacto de El Niño / La Niña en el rendimiento de los cultivos de Colombia y sistema de alerta temprana de malas cosechas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0,<2.3",
  "scipy>=1.13,<1.16",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agroclima = "agroclima.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agroclima", "data", "charts"]
